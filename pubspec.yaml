name: tech_store

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  dio: ^5.11.0
  flutter_bloc: ^9.1.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.5.7
  local_auth: ^2.3.0
  cloud_firestore: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tech.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/tech.png
    - assets/image/First.png
    - assets/image/second.png
    - assets/image/third.png
    - assets/image/Banner1.avif
    - assets/image/banner2.jpg
    - assets/image/banner3.jpg
    - assets/image/banner4.jpg
    - assets/image/banner5.jpg